<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cybra Runner UI</title>
  <script>
    async function runScript(script){
      const res = await fetch('/runner/run', {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'script='+encodeURIComponent(script)
      });
      const data = await res.json();
      alert(data.message);
    }
  </script>
</head>
<body>
  <h1>Запуск скриптів</h1>
  <ul>
    {% for s in scripts %}
      <li>{{ s }} <button onclick="runScript('{{ s }}')">Запустити</button></li>
    {% endfor %}
  </ul>
</body>
</html>
